name: AI Sales HQ

on:
  push:
    paths: ['ai-sales-hq/**']
  pull_request:
    paths: ['ai-sales-hq/**']

permissions:
  contents: read

concurrency:
  group: ai-sales-hq-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: ai-sales-hq

jobs:
  check:
    name: Lint, typecheck, unit tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ai-sales-hq/package-lock.json
      - run: npm ci
      - name: Lint and format (Biome)
        run: npm run check
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests (API)
        run: npm run test:unit -w @hq/api
      - name: Unit tests (web)
        run: npm run test -w @hq/web
      - name: Build
        env:
          NODE_ENV: production
        run: npm run build
      - name: Dependency audit (runtime, high+)
        run: npm audit --omit=dev --audit-level=high

  integration:
    name: Integration tests (MySQL 8.0)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: hq_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      DATABASE_URL: mysql://root:root@127.0.0.1:3306/hq_test
      TEST_DATABASE_URL: mysql://root:root@127.0.0.1:3306/hq_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ai-sales-hq/package-lock.json
      - run: npm ci
      - name: Apply migrations
        working-directory: ai-sales-hq/apps/api
        run: npx prisma generate && npx prisma migrate deploy
      - name: Schema matches migrations
        working-directory: ai-sales-hq/apps/api
        run: npx prisma migrate diff --from-config-datasource --to-schema prisma/schema.prisma --exit-code
      - name: Integration tests
        run: npm run test:integration -w @hq/api

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks (ai-sales-hq only)
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.24.2/gitleaks_8.24.2_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks dir . --no-banner --redact
