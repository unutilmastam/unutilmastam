<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <title>LabCore — sozlash</title>
  <style>
    body { font-family: "Segoe UI", sans-serif; margin: 0; padding: 26px; background: #f4f6f9; color: #0f172a; }
    h1 { font-size: 18px; margin: 0 0 4px; }
    p.sub { color: #64748b; font-size: 13px; margin: 0 0 18px; }
    label { display: block; font-size: 12px; font-weight: 600; color: #64748b; margin-bottom: 4px; }
    input { width: 100%; padding: 9px 10px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 14px; box-sizing: border-box; }
    button { width: 100%; padding: 10px; margin-top: 12px; border: none; border-radius: 8px;
             background: #0d7d74; color: #fff; font-weight: 600; font-size: 14px; cursor: pointer; }
    button:disabled { opacity: .6; cursor: not-allowed; }
    .msg { margin-top: 12px; padding: 9px 11px; border-radius: 8px; font-size: 13px; }
    .ok { background: #dcfce7; color: #15803d; }
    .err { background: #fdecea; color: #c0392b; }
    .station { margin-top: 16px; font-size: 12px; color: #64748b; }
    .check { display: flex; gap: 9px; align-items: flex-start; margin-top: 16px; }
    .check input { width: auto; margin-top: 2px; }
    .check label { font-size: 13px; font-weight: 500; color: #0f172a; margin: 0; cursor: pointer; }
    .check .hint { display: block; font-size: 12px; color: #64748b; font-weight: 400; margin-top: 2px; }
  </style>
</head>
<body>
  <h1>🧪 LabCore</h1>
  <p class="sub">Laboratoriya serverining manzilini kiriting</p>

  <label for="url">Server manzili</label>
  <input id="url" value="https://192.168.1.10:4000" spellcheck="false">

  <div class="check">
    <input type="checkbox" id="autostart" checked>
    <label for="autostart">
      Kompyuter yoqilganda avtomatik ochilsin
      <span class="hint">Ertalab hech narsa qidirmaysiz — LabCore ekranda turadi.</span>
    </label>
  </div>

  <button id="test">Ulanishni tekshirish</button>
  <button id="save" disabled>Saqlash va davom etish</button>

  <div id="msg"></div>
  <div class="station" id="station"></div>

  <script src="setup.js"></script>
</body>
</html>
