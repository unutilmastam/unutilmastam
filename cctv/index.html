<!DOCTYPE html>
<html lang="uz" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<title>BRILIANT — universal kamera platformasi</title>
<meta name="description" content="Turli brenddagi IP kameralarni bitta ilovada boshqaring: jonli video, arxiv, PTZ, AI aniqlash va bildirishnomalar.">
<meta name="theme-color" content="#0B0F14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="BRILIANT">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./css/app.css">
</head>
<body>
<div id="app">
  <div id="view"></div>
</div>
<nav class="nav hidden" id="nav"></nav>
<noscript>
  <div style="padding:40px;text-align:center;color:#93A3BA;font-family:sans-serif">
    Ilova ishlashi uchun JavaScript yoqilgan boʻlishi kerak.
  </div>
</noscript>

<!-- Eski brauzer/WebView: oq ekran oʻrniga tushunarli xabar -->
<script nomodule>
  document.getElementById('view').innerHTML =
    '<div style="padding:44px 24px;text-align:center;color:#93A3BA;font-family:sans-serif;line-height:1.5">'
    + '<div style="font-size:38px">⚠️</div>'
    + '<h2 style="color:#E8EEF7;margin:12px 0 8px">Brauzer eskirgan</h2>'
    + '<p style="font-size:14px">Ilova ishlashi uchun brauzeringizni yangilang.<br>'
    + 'Android’da: Play Market → <b>Android System WebView</b> va <b>Chrome</b> ni yangilang.</p></div>';
</script>

<script type="module" src="./js/app.js"></script>
<script type="module">
  // Ilova umuman ishga tushmasa — foydalanuvchi sababini koʻrsin
  addEventListener('error', e => {
    const v = document.getElementById('view');
    if (!v || v.children.length) return;
    v.innerHTML = '<div style="padding:44px 24px;text-align:center;color:#93A3BA;font-family:sans-serif">'
      + '<div style="font-size:38px">⚠️</div>'
      + '<h2 style="color:#E8EEF7;margin:12px 0 8px">Ilova ochilmadi</h2>'
      + '<p style="font-size:13px">' + (e.message || 'Nomaʼlum xato') + '</p>'
      + '<button onclick="location.reload()" style="margin-top:14px;padding:11px 20px;border:0;border-radius:12px;'
      + 'background:#2E8FFF;color:#fff;font-weight:700;font-size:14px">Qayta yuklash</button></div>';
  });
</script>
</body>
</html>
